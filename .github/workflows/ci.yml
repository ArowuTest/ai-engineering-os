name: Engineering OS CI

on:
  push:
    branches: [main, 'feature/**', 'chore/**', 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  platform:
    name: Platform Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: engineering_os
          POSTGRES_PASSWORD: engineering_os
          POSTGRES_DB: engineering_os_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U engineering_os -d engineering_os_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'

      - name: Install platform dependencies
        working-directory: platform
        run: npm ci --ignore-scripts

      - name: Run platform tests
        working-directory: platform
        env:
          DATABASE_URL: postgresql://engineering_os:engineering_os@localhost:55432/engineering_os_test
        run: npm test

      - name: Typecheck platform
        working-directory: platform
        run: npm run typecheck

      - name: Build Product Studio web application
        working-directory: platform
        run: npm run build --workspace @engineering-os/web

      - name: Audit platform runtime dependencies
        working-directory: platform
        run: |
          npm audit signatures
          npm audit --omit=dev --audit-level=high

  ecc-compatibility:
    name: ECC Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'

      - name: Install ECC validation dependencies
        run: npm ci --ignore-scripts

      - name: Validate agents
        run: node scripts/ci/validate-agents.js

      - name: Validate hooks
        run: node scripts/ci/validate-hooks.js

      - name: Validate commands
        run: node scripts/ci/validate-commands.js

      - name: Validate skills
        run: node scripts/ci/validate-skills.js

      - name: Validate install manifests
        run: node scripts/ci/validate-install-manifests.js

      - name: Validate rules
        run: node scripts/ci/validate-rules.js

      - name: Validate workflow security
        run: node scripts/ci/validate-workflow-security.js

      - name: Validate catalog
        run: node scripts/ci/validate-derivative-ecc-catalog.js --text

      - name: Validate command registry
        run: npm run command-registry:check

      - name: Check Unicode safety
        run: node scripts/ci/check-unicode-safety.js

      - name: Validate no personal paths
        run: node scripts/ci/validate-no-personal-paths.js

      - name: Run supply-chain IOC scan
        run: npm run security:ioc-scan
